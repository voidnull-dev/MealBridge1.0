<body class="dashboard-page">
  <a class="skip-link" href="#access-gate">Skip to workspace</a>
  <main id="access-gate" class="access-gate" tabindex="-1" aria-labelledby="access-title">
    <a class="brand" href="index.html"><img src="assets/icons/mark.svg" alt="">MealBridge<span>.</span></a>
    <div class="access-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 id="access-title">Connecting your workspace.</h1>
    <p id="access-message" role="status">Checking your Google session and food provider profile…</p>
    <div class="gate-actions"><a class="button primary" id="gate-link" href="index.html#join">Back to MealBridge <span aria-hidden="true">↗</span></a><button class="button secondary" id="gate-retry" hidden>Retry connection</button></div>
    <p class="gate-note">Hostel / Food Provider accounts only.</p>
  </main>
  <!-- Dashboard markup is rendered only after a server-read profile grants hostel UI access. -->
  <div id="dashboard-root" hidden></div>
  <noscript><p class="noscript-note">JavaScript and a local server are required to verify your Google session. <a href="index.html">Return to MealBridge</a>.</p></noscript>
